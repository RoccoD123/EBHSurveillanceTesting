<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EBH Surveillance — Operator Sign-In</title>
<style>
  :root{
    --bg:#0a1a26; --bg2:#0d2333; --card:#0f2433; --gold:#d4af37; --gold2:#f0c040;
    --muted:#8aa0b0; --text:#e8eef2; --border:#1d3a4f; --green:#3fb96a; --red:#e0556a;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%, #12344c 0%, var(--bg) 60%);
    color:var(--text);font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;padding:24px;}
  .wrap{width:100%;max-width:480px;}
  header{text-align:center;margin-bottom:22px;}
  header h1{color:var(--gold);font-size:1.9rem;margin:0 0 4px;letter-spacing:1px;}
  header p{color:var(--muted);margin:0;font-size:0.95rem;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:26px 24px;box-shadow:0 10px 40px rgba(0,0,0,0.35);}
  .card h2{color:var(--gold);text-align:center;margin:0 0 18px;font-size:1.25rem;}
  label{display:block;color:var(--muted);font-size:0.85rem;margin-bottom:6px;letter-spacing:0.5px;}
  input{width:100%;padding:13px 14px;border-radius:9px;border:1px solid var(--border);background:#0b1622;color:var(--text);
    font-family:inherit;font-size:1.1rem;letter-spacing:1px;outline:none;}
  input:focus{border-color:var(--gold);}
  .err{color:var(--red);font-size:0.9rem;min-height:1.2em;margin:10px 2px 0;}
  .btn{display:block;width:100%;margin-top:18px;padding:14px;border:none;border-radius:9px;cursor:pointer;
    background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1206;font-weight:bold;font-size:1.05rem;font-family:inherit;letter-spacing:1px;}
  .btn:disabled{opacity:0.6;cursor:default;}
  .btn-back{background:none;border:1px solid var(--border);color:var(--muted);}
  .note{color:var(--muted);font-size:0.82rem;text-align:center;margin-top:16px;line-height:1.5;}
  .msg-title{color:var(--gold);text-align:center;font-size:1.3rem;margin:0 0 10px;}
  .msg-body{color:var(--text);text-align:center;line-height:1.6;}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,0.3);border-top-color:#1a1206;border-radius:50%;animation:sp 0.7s linear infinite;vertical-align:-2px;margin-right:8px;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>&#9824; EBH Surveillance &#9824;</h1><p>Annual Operator Assessment</p></header>
  <div class="card" id="form-card">
    <h2>Operator Sign-In</h2>
    <label for="emp">Employee Number</label>
    <input id="emp" inputmode="numeric" autocomplete="off" autofocus>
    <div class="err" id="err"></div>
    <button class="btn" id="go-btn" onclick="LOGIN.go()">Continue</button>
    <p class="note">Enter your employee number to begin. You'll be taken to the correct assessment for your record.</p>
  </div>
  <div class="card" id="msg-card" style="display:none;">
    <div id="msg"></div>
    <button class="btn btn-back" onclick="location.reload()">&lsaquo; Back</button>
  </div>
</div>
<script>
(function(){
  var LOG_URL='https://script.google.com/macros/s/AKfycbyoaMKa5gsIxkRS8ynTnfgpNPqMD4QxV57wA3OeNBcCZ6KJ-GnqZg997-p9e68Zq8Gb/exec';
  var LOG_TOKEN='EBHSurveillanceTesting';
  function $(id){return document.getElementById(id);}
  var _jcb=0;
  function jsonp(url,cb){
    var name='__lp'+(_jcb++);
    var s=document.createElement('script');
    window[name]=function(d){ try{cb(d);}finally{ delete window[name]; if(s.parentNode)s.parentNode.removeChild(s); } };
    s.onerror=function(){ try{cb(null);}finally{ delete window[name]; if(s.parentNode)s.parentNode.removeChild(s); } };
    s.src=url+(url.indexOf('?')<0?'?':'&')+'callback='+name;
    document.body.appendChild(s);
  }
  function reset(){ $('go-btn').disabled=false; $('go-btn').innerHTML='Continue'; }
  function showMsg(title,body){ $('form-card').style.display='none'; var m=$('msg-card'); m.style.display='block'; $('msg').innerHTML='<h2 class="msg-title">'+title+'</h2><p class="msg-body">'+body+'</p>'; }
  function applyRoute(st){
    var emp=encodeURIComponent(String(st.employeeId||''));
    if(st.route==='retest'){ location.href='retest.html?emp='+emp; return 'retest.html?emp='+emp; }
    if(st.route==='exam'){ location.href='exam.html?emp='+emp; return 'exam.html?emp='+emp; }
    if(st.route==='certified'){ showMsg('&#10003; You are fully certified', 'Every game is at 80% or above &mdash; there is nothing to take'+(st.name?(', '+st.name):'')+'. Thank you.'); return 'certified'; }
    if(st.route==='supervisor'){ showMsg('Please see your supervisor', 'You have used all attempts for this cycle. Your supervisor will advise on next steps.'); return 'supervisor'; }
    location.href='exam.html?emp='+emp; return 'exam.html?emp='+emp; // safe fallback
  }
  function go(){
    var emp=$('emp').value.trim();
    if(!emp){ $('err').textContent='Please enter your employee number.'; return; }
    $('err').textContent=''; $('go-btn').disabled=true; $('go-btn').innerHTML='<span class="spin"></span>Checking…';
    jsonp(LOG_URL+'?action=status&key='+encodeURIComponent(LOG_TOKEN)+'&employeeId='+encodeURIComponent(emp), function(st){
      if(!st||!st.ok){ reset(); $('err').textContent='Could not look you up. Check your number, or see your supervisor.'; return; }
      applyRoute(st);
    });
  }
  document.addEventListener('keydown',function(e){ if(e.key==='Enter' && $('form-card').style.display!=='none'){ e.preventDefault(); go(); } });
  window.LOGIN={ go:go, applyRoute:applyRoute };
})();
</script>
</body>
</html>
